name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Run the suite on any branch, on demand, without merging and without taking
  # a PR out of draft. Without this the triggers above mean a build branch's
  # FIRST execution on a CI-pinned interpreter is the merge to main, so an
  # interpreter-specific failure lands after the point of no return. The
  # deposition build hit exactly that: fourteen review rounds of a migration
  # guard, every green number produced on the developer's 3.12, while CI pins
  # the 3.11 floor.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Both ends of the supported range, because testing only one leaves the
      # other to be discovered somewhere worse. pyproject declares
      # requires-python = ">=3.11" (a floor, not a pin) and nothing pins the
      # deploy runtime, so 3.11 catches use of anything newer than the floor
      # allows and 3.12 catches breakage on what developers and the deploy
      # actually run. fail-fast off so one version's failure does not cancel
      # the other's result; when they disagree, the disagreement is the finding.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # Skip CI on draft PRs: an in-progress build keeps its PR in draft, so the
    # acceptance-criteria stub tests stay red without emailing the operator on
    # every push. Marking the PR "Ready for review" fires ready_for_review and
    # runs the job once, so a failure email then means a real problem.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # A real Postgres server, so the per-run database fixture in
    # tests/conftest.py (learning L86) is exercised here rather than skipped.
    # TEST_DATABASE_URL names the server and a BASE database; each test run
    # creates and drops its own database beside it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test-only. The migration guard itself imports nothing but the
          # standard library, so a build that never touches a database still
          # installs no ORM. Its tests need an engine, and they must RUN here:
          # they importorskip, and a silent skip would leave the guard shipped
          # and unproven, which is worse than shipping no guard at all.
          pip install pytest sqlalchemy
          # Test-only, for the same reason: the per-run database fixture's
          # Postgres tests FAIL in CI without a driver rather than skip.
          pip install "psycopg[binary]"
      - name: Run tests
        run: pytest -v
